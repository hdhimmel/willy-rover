# Simulated test suite on every push and pull request (outside review 2026-10-07: "no CI workflow
# is reporting against the latest commit"). Everything here runs under WILLY_SIMULATE=1, the same
# as `pytest` on willie -- no I2C, UART, camera or Hailo. Passing here proves the logic, never the
# hardware: live checks still happen on the rover.
name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WILLY_SIMULATE: "1"
      SDL_VIDEODRIVER: dummy      # pygame imports without a display
      SDL_AUDIODRIVER: dummy
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # matches willie (Python 3.13.5)
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install pytest numpy networkx pygame-ce scipy smbus2
      - name: Syntax check every Python file
        run: python -m compileall -q -x '(\.venv|venv)' .
      - name: Simulated test suite
        # Logs need a GitHub login; ANNOTATIONS are public through the API. So every collection
        # error, error and failure is also emitted as an annotation (GitHub keeps 10 per type
        # per step -- the count line says how many there were in all).
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider -rfE --tb=line 2>&1 | tee pytest.out
          rc=${PIPESTATUS[0]}
          grep -E "^(ERROR|FAILED) " pytest.out | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "^E +[A-Za-z]*Error" pytest.out | sort | uniq -c | sort -rn | head -5 | while IFS= read -r line; do echo "::warning::$line"; done
          echo "::notice::$(tail -1 pytest.out)"
          exit $rc
