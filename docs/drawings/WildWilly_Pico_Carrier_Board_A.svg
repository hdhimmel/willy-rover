  <text class="t tbig" x="516" y="234" text-anchor="middle">PICO 2 W &#8212; columns 11&#8211;30, pins in rows C and H</text>
  <text class="tsm" x="516" y="252" text-anchor="middle">USB at the column-11 end &#183; pins point DOWN, board seen from above</text>
