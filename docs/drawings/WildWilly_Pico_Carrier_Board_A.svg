    </pattern>
    <pattern id="sTopA" width="24" height="120" patternUnits="userSpaceOnUse" x="48" y="108">
      <rect x="6" y="4" width="12" height="112" rx="6" fill="currentColor" opacity="0.10"/>
    </pattern>
    <pattern id="sBotA" width="24" height="120" patternUnits="userSpaceOnUse" x="48" y="252">
      <rect x="6" y="4" width="12" height="112" rx="6" fill="currentColor" opacity="0.10"/>
    </pattern>
  </defs>
