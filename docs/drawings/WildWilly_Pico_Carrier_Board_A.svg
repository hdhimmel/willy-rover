<svg viewBox="-330 0 1500 512" role="img" aria-label="Board A hole layout. The Pico sits over columns 11 to 30 with pin rows in C and H, USB at the column-11 end. Row C carries pins 21 to 40, row H carries pins 1 to 20. The power chain occupies the ten free columns to the left: F1 stands from the upper plus rail into column 9 row A, and D1 spans column 9 to column 12 in row B with its band at column 12, landing VSYS directly on pin 39. There are no jumpers. Ground leaves column 13 for the upper minus rail. R2 drops from the upper plus rail into column 17 row A and R3 runs column 17 to column 18 in row B, landing the divider on GP28 and AGND. The twelve encoder wires land in row I of columns 11 to 25. Dashed squares mark the spare GPIOs: nine on the top side in row A and two on the bottom. D2, drawn dashed because it is not fitted yet, stands between the two top rails at column 6 with its band on the plus rail: a reverse-polarity clamp that trips F1 if the feed is connected backwards.">
