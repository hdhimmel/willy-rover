  <text class="tsm" x="516" y="288" text-anchor="middle">TOP: col 11 = 40 VBUS &#9888; leave empty &#183; col 12 = 39 VSYS &#183; col 13 = 38 GND &#183; col 17 = 34 GP28 &#183; col 18 = 33 AGND</text>
  <text class="tsm" x="516" y="306" text-anchor="middle">BOTTOM: cols 11,12,14,15,16,17 = sonar &#183; 26 = TX &#183; 27 = RX &#183; 28 = EMPTY, no second ground &#183; 30 = GP15 RST</text>
